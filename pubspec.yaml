name: flowpay
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3
  cloud_firestore: ^6.1.1
  supabase_flutter: ^2.10.0
  flutter_bloc: ^9.1.1
  local_auth: ^3.0.0
  flutter_secure_storage: ^10.0.0
  file_picker: ^10.3.3
  cached_network_image: ^3.4.1
  firebase_messaging: ^16.1.0
  flutter_local_notifications: ^19.4.2
  http: ^1.5.0
  googleapis_auth: ^2.0.0
  flutter_stripe: ^12.1.1
  dotted_border: ^3.1.0
  intl: ^0.20.2
  percent_indicator: ^4.2.5
  pdf: ^3.11.3
  printing: ^5.14.2
  path_provider: ^2.1.5
  share_plus: ^12.0.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0
  camera: ^0.12.0+1
  permission_handler: ^12.0.1
  device_info_plus: ^12.4.0
  local_auth_android: ^2.0.7
  emoji_picker_flutter: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4


flutter:
  uses-material-design: true
  assets:
    - assets/service-accounts.json
    - assets/images/
    - assets/navigation/
    - assets/home/
    - assets/transfer/
    - assets/pocket/
    - assets/chat/
    - assets/setting/
    - assets/bill/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/flowpay_logo.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/images/flowpay_logo.png"

